<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif" role="img" aria-labelledby="title">
  <title id="title">Zero-downtime billing migration: Phase A, Phase B cutover, backfill of 1,535 accounts, and a staged rollout, over an always-on safety net</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#c9bda3" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f68"/>
    </marker>
    <clipPath id="frame">
      <rect x="16" y="16" width="928" height="608"/>
    </clipPath>
  </defs>

  <rect width="960" height="640" fill="#faf6ee"/>

  <g clip-path="url(#frame)">
    <ellipse cx="220" cy="290" rx="220" ry="150" fill="#e3ecf5" opacity="0.45"/>
    <ellipse cx="700" cy="350" rx="230" ry="160" fill="#f5ead6" opacity="0.4"/>
    <ellipse cx="560" cy="180" rx="190" ry="100" fill="#e4efe4" opacity="0.4"/>
    <rect x="40" y="440" width="130" height="50" fill="url(#dots)"/>
    <rect x="858" y="300" width="62" height="50" fill="url(#dots)"/>
  </g>

  <!-- Always-on safety net -->
  <path d="M16,556 Q146,536 276,556 T536,556 T796,556 Q870,567 944,556 L944,624 L16,624 Z" fill="#dfe9dc" opacity="0.9"/>
  <path d="M16,574 Q196,560 376,574 T736,574 Q840,566 944,574 L944,624 L16,624 Z" fill="#d7e3f2" opacity="0.55"/>
  <text x="480" y="586" text-anchor="middle" font-size="12.5" letter-spacing="2" fill="#3c4a3c" font-weight="700">ALWAYS-ON SAFETY NET</text>
  <text x="480" y="607" text-anchor="middle" font-size="14" fill="#3c4a3c">idempotent webhooks &#183; Stripe is the source of truth &#183; self-healing</text>

  <rect x="16" y="16" width="928" height="608" fill="none" stroke="#d8cfbc" stroke-width="1"/>

  <text x="40" y="56" font-size="13" letter-spacing="3" fill="#8a7f68" font-weight="600">ZERO-DOWNTIME BILLING MIGRATION</text>
  <text x="920" y="56" text-anchor="end" font-size="14" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">3,000 paying accounts &#183; $800K ARR</text>
  <text x="920" y="78" text-anchor="end" font-size="13" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">zero downtime &#183; no revenue discrepancies</text>

  <!-- Path between phases -->
  <g fill="none" stroke="#8a7f68" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M270,196 C300,196 290,366 320,366"/>
    <path d="M550,366 C580,366 570,213 600,213"/>
    <path d="M760,306 C760,340 805,338 805,372"/>
  </g>

  <!-- Phase A -->
  <rect x="40" y="120" width="230" height="152" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M40,130 a10,10 0 0 1 10,-10 h210 a10,10 0 0 1 10,10 v22 h-230 z" fill="#2b3a55"/>
  <text x="155" y="141" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">PHASE A</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="56" y="169" width="24" height="24" rx="6" fill="#7ba3c9"/><text x="68" y="186">A</text>
    <rect x="56" y="203" width="24" height="24" rx="6" fill="#7ba05b"/><text x="68" y="220">B</text>
    <rect x="56" y="237" width="24" height="24" rx="6" fill="#d9a441"/><text x="68" y="254">C</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="92" y="186">old endpoint live</text>
    <text x="92" y="220">new: 200 and ignore</text>
    <text x="92" y="254">monitor first</text>
  </g>

  <!-- Phase B -->
  <rect x="320" y="290" width="230" height="152" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M320,300 a10,10 0 0 1 10,-10 h210 a10,10 0 0 1 10,10 v22 h-230 z" fill="#a8752a"/>
  <text x="435" y="311" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">PHASE B &#183; CUTOVER</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="336" y="339" width="24" height="24" rx="6" fill="#5b8a8a"/><text x="348" y="356">A</text>
    <rect x="336" y="373" width="24" height="24" rx="6" fill="#d97f4a"/><text x="348" y="390">B</text>
    <rect x="336" y="407" width="24" height="24" rx="6" fill="#c97b9a"/><text x="348" y="424">C</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="372" y="356">old returns 400</text>
    <text x="372" y="390">Stripe retries 3 days</text>
    <text x="372" y="424">safe rollback</text>
  </g>

  <!-- Backfill -->
  <rect x="600" y="120" width="230" height="186" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M600,130 a10,10 0 0 1 10,-10 h210 a10,10 0 0 1 10,10 v22 h-230 z" fill="#a34a3a"/>
  <text x="715" y="141" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">BACKFILL &#183; 1,535</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="616" y="169" width="24" height="24" rx="6" fill="#7e6ba8"/><text x="628" y="186">A</text>
    <rect x="616" y="203" width="24" height="24" rx="6" fill="#5b8a8a"/><text x="628" y="220">B</text>
    <rect x="616" y="237" width="24" height="24" rx="6" fill="#9a9a9a"/><text x="628" y="254">C</text>
    <rect x="616" y="271" width="24" height="24" rx="6" fill="#7ba05b"/><text x="628" y="288">D</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="652" y="186">1,468 scripted</text>
    <text x="652" y="220">56 consolidated</text>
    <text x="652" y="254">11 manual runbook</text>
    <text x="652" y="288">shared verifier</text>
  </g>

  <!-- Rollout -->
  <rect x="690" y="372" width="230" height="152" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M690,382 a10,10 0 0 1 10,-10 h210 a10,10 0 0 1 10,10 v22 h-230 z" fill="#2f4a3c"/>
  <text x="805" y="393" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">ROLLOUT</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="706" y="421" width="24" height="24" rx="6" fill="#7ba05b"/><text x="718" y="438">A</text>
    <rect x="706" y="455" width="24" height="24" rx="6" fill="#7ba3c9"/><text x="718" y="472">B</text>
    <rect x="706" y="489" width="24" height="24" rx="6" fill="#d9a441"/><text x="718" y="506">C</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="742" y="438">pilot, 10%, GA</text>
    <text x="742" y="472">feature flags</text>
    <text x="742" y="506">zero downtime</text>
  </g>
</svg>

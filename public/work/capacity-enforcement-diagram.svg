<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif" role="img" aria-labelledby="title">
  <title id="title">Plan limit enforcement: daily scan, a 15-day countdown of in-app notices and emails, a freeze on day 15, and a restore on payment</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#c9bda3" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f68"/>
    </marker>
    <clipPath id="frame">
      <rect x="16" y="16" width="928" height="578"/>
    </clipPath>
  </defs>

  <rect width="960" height="610" fill="#faf6ee"/>

  <g clip-path="url(#frame)">
    <ellipse cx="150" cy="280" rx="150" ry="130" fill="#e3ecf5" opacity="0.5"/>
    <ellipse cx="500" cy="285" rx="230" ry="140" fill="#f5ead6" opacity="0.45"/>
    <ellipse cx="825" cy="380" rx="130" ry="200" fill="#e4efe4" opacity="0.5"/>
    <rect x="40" y="76" width="140" height="44" fill="url(#dots)"/>
    <rect x="40" y="520" width="120" height="40" fill="url(#dots)"/>
  </g>

  <rect x="16" y="16" width="928" height="578" fill="none" stroke="#d8cfbc" stroke-width="1"/>

  <text x="40" y="56" font-size="13" letter-spacing="3" fill="#8a7f68" font-weight="600">PLAN LIMIT ENFORCEMENT</text>

  <!-- Outcome -->
  <rect x="640" y="40" width="280" height="80" rx="10" fill="#fffdf8" stroke="#d8cfbc"/>
  <text x="660" y="64" font-size="11.5" letter-spacing="2" fill="#8a7f68" font-weight="700">OUTCOME</text>
  <text x="660" y="88" font-size="14" fill="#232b3e">600 accounts over limits</text>
  <text x="660" y="108" font-size="14" fill="#232b3e">15&#8211;20 upgrades day one &#183; +15% MRR</text>

  <!-- Daily scan -->
  <rect x="40" y="193" width="220" height="154" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M40,203 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v22 h-220 z" fill="#2b3a55"/>
  <text x="150" y="214" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">DAILY SCAN</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="56" y="242" width="24" height="24" rx="6" fill="#7ba3c9"/><text x="68" y="259">A</text>
    <rect x="56" y="276" width="24" height="24" rx="6" fill="#7ba05b"/><text x="68" y="293">B</text>
    <rect x="56" y="310" width="24" height="24" rx="6" fill="#d9a441"/><text x="68" y="327">C</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="92" y="259">25,000 accounts</text>
    <text x="92" y="293">checks plan limits</text>
    <text x="92" y="327">flags over-limit</text>
  </g>

  <line x1="260" y1="270" x2="300" y2="270" stroke="#8a7f68" stroke-width="2.25" marker-end="url(#arrow)"/>

  <!-- Countdown axis -->
  <line x1="300" y1="270" x2="700" y2="270" stroke="#b9ac8e" stroke-width="2"/>
  <g stroke="#b9ac8e" stroke-width="2">
    <line x1="300" y1="262" x2="300" y2="278"/>
    <line x1="433" y1="262" x2="433" y2="278"/>
    <line x1="567" y1="262" x2="567" y2="278"/>
    <line x1="700" y1="262" x2="700" y2="278"/>
  </g>
  <g font-size="12" letter-spacing="1" fill="#8a7f68" font-weight="600" text-anchor="middle">
    <text x="300" y="298">DAY 0</text>
    <text x="433" y="298">DAY 5</text>
    <text x="567" y="298">DAY 10</text>
    <text x="700" y="298">DAY 15</text>
  </g>

  <!-- In-app notices -->
  <text x="300" y="156" font-size="12.5" letter-spacing="1.5" fill="#3e6b6b" font-weight="700">IN-APP NOTICES <tspan font-weight="400" letter-spacing="0.5" fill="#6b7a76">&#183; daily users</tspan></text>
  <line x1="300" y1="176" x2="700" y2="176" stroke="#5b8a8a" stroke-width="2"/>
  <g fill="#5b8a8a" stroke="#ffffff" stroke-width="2">
    <circle cx="420" cy="176" r="6"/>
    <circle cx="555" cy="176" r="6"/>
    <circle cx="670" cy="176" r="6"/>
  </g>
  <g font-size="14" fill="#3e4a48" text-anchor="middle">
    <text x="420" y="202">session-start dialog</text>
    <text x="555" y="202">status chip</text>
    <text x="670" y="202">final warning</text>
  </g>

  <!-- Email drip -->
  <text x="300" y="380" font-size="12.5" letter-spacing="1.5" fill="#8a6420" font-weight="700">EMAIL DRIP <tspan font-weight="400" letter-spacing="0.5" fill="#7a6a45">&#183; all accounts</tspan></text>
  <line x1="300" y1="400" x2="700" y2="400" stroke="#c08a3e" stroke-width="2"/>
  <g fill="#c08a3e" stroke="#ffffff" stroke-width="2">
    <circle cx="420" cy="400" r="6"/>
    <circle cx="555" cy="400" r="6"/>
    <circle cx="670" cy="400" r="6"/>
  </g>
  <g font-size="14" fill="#4a4234" text-anchor="middle">
    <text x="420" y="426">owner email</text>
    <text x="555" y="426">reminder</text>
    <text x="670" y="426">last call</text>
  </g>

  <line x1="700" y1="270" x2="730" y2="270" stroke="#8a7f68" stroke-width="2.25" marker-end="url(#arrow)"/>

  <!-- Frozen -->
  <rect x="730" y="193" width="190" height="154" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M730,203 a10,10 0 0 1 10,-10 h170 a10,10 0 0 1 10,10 v22 h-190 z" fill="#a34a3a"/>
  <text x="825" y="214" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">FROZEN &#183; DAY 15</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="746" y="242" width="24" height="24" rx="6" fill="#7e6ba8"/><text x="758" y="259">A</text>
    <rect x="746" y="276" width="24" height="24" rx="6" fill="#5b8a8a"/><text x="758" y="293">B</text>
    <rect x="746" y="310" width="24" height="24" rx="6" fill="#9a9a9a"/><text x="758" y="327">C</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="782" y="259">frozen_at set</text>
    <text x="782" y="293">read-only banner</text>
    <text x="782" y="327">roles untouched</text>
  </g>

  <line x1="825" y1="347" x2="825" y2="390" stroke="#8a7f68" stroke-width="2.25" marker-end="url(#arrow)"/>

  <!-- Paid, restored -->
  <rect x="730" y="390" width="190" height="154" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M730,400 a10,10 0 0 1 10,-10 h170 a10,10 0 0 1 10,10 v22 h-190 z" fill="#2f4a3c"/>
  <text x="825" y="411" text-anchor="middle" font-size="13.5" letter-spacing="2" fill="#ffffff" font-weight="700">PAID &#183; RESTORED</text>
  <g font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <rect x="746" y="439" width="24" height="24" rx="6" fill="#7ba05b"/><text x="758" y="456">A</text>
    <rect x="746" y="473" width="24" height="24" rx="6" fill="#7ba3c9"/><text x="758" y="490">B</text>
    <rect x="746" y="507" width="24" height="24" rx="6" fill="#d9a441"/><text x="758" y="524">C</text>
  </g>
  <g font-size="15" fill="#232b3e">
    <text x="782" y="456">customer pays</text>
    <text x="782" y="490">frozen_at cleared</text>
    <text x="782" y="524">banner lifts live</text>
  </g>

  <text x="480" y="576" text-anchor="middle" font-size="14.5" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">warn in the channel they&#8217;ll see &#183; freeze automatically &#183; unfreeze on payment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif">
  <defs>
    <pattern id="dots3" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#c9bda3" opacity="0.45"/>
    </pattern>
    
  </defs>

  <rect width="1200" height="660" fill="#faf6ee"/>
  <rect x="24" y="24" width="1152" height="612" fill="none" stroke="#d8cfbc" stroke-width="1"/>

  <ellipse cx="200" cy="360" rx="180" ry="140" fill="#e3ecf5" opacity="0.45"/>
  <ellipse cx="700" cy="300" rx="260" ry="160" fill="#f5ead6" opacity="0.4"/>
  <ellipse cx="1050" cy="420" rx="150" ry="140" fill="#e4efe4" opacity="0.45"/>
  <rect x="80" y="120" width="140" height="50" fill="url(#dots3)"/>
  <rect x="1020" y="120" width="110" height="44" fill="url(#dots3)"/>

  <text x="48" y="66" font-size="15" letter-spacing="3" fill="#8a7f68" font-weight="600">ADJUST PLAN WIZARD &#183; XSTATE</text>
  <text x="1152" y="66" text-anchor="end" font-size="14" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">seven PRs &#183; one unchanged machine</text>

  <!-- guard bypass arc (drawn first, behind) -->
  <path d="M430,190 C560,92 800,92 1031.1,286.5" fill="none" stroke="#7ba05b" stroke-width="2" stroke-dasharray="7,5"/><polygon points="1040.4,294.1 1027.2,289.7 1033.5,282.0" fill="#7ba05b"/>
  <rect x="544" y="116" width="300" height="26" rx="13" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="694" y="133" text-anchor="middle" font-size="12" fill="#3e5c3e" font-weight="600">CONFIRM &#8212; card on file or $0 due, skip payment</text>

  <!-- transitions -->
  <line x1="240" y1="365" x2="286.6" y2="352.6" stroke="#5a4f3a" stroke-width="2"/><polygon points="298.2,349.5 286.9,357.7 284.4,348.0" fill="#5a4f3a"/>
  <line x1="550" y1="322" x2="606.5" y2="308.2" stroke="#5a4f3a" stroke-width="2"/><polygon points="618.2,305.4 606.8,313.3 604.4,303.6" fill="#5a4f3a"/>
  <line x1="870" y1="330" x2="927.0" y2="350.0" stroke="#5a4f3a" stroke-width="2"/><polygon points="938.3,354.0 924.4,354.4 927.7,345.0" fill="#5a4f3a"/>
  <line x1="1045" y1="420" x2="1045.0" y2="426.0" stroke="#5a4f3a" stroke-width="2"/><polygon points="1045.0,438.0 1040.0,425.0 1050.0,425.0" fill="#5a4f3a"/>

  <!-- ADJUST -->
  <rect x="60" y="300" width="180" height="130" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
  <path d="M60,312 a12,12 0 0 1 12,-12 h156 a12,12 0 0 1 12,12 v24 h-180 z" fill="#2b3a55"/>
  <text x="150" y="323" text-anchor="middle" font-size="12.5" letter-spacing="2" fill="#ffffff" font-weight="700">ADJUST</text>
  <text x="78" y="362" font-size="13" fill="#232b3e" font-weight="600">plan editor</text>
  <text x="78" y="380" font-size="11.5" fill="#6b6b6b">plans &#183; add-ons</text>
  <text x="78" y="404" font-size="13" fill="#232b3e" font-weight="600">cancel flow</text>
  <text x="78" y="422" font-size="11.5" fill="#6b6b6b">reason captured</text>

  <!-- PREVIEW (compound) -->
  <rect x="310" y="190" width="240" height="280" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
  <path d="M310,202 a12,12 0 0 1 12,-12 h216 a12,12 0 0 1 12,12 v24 h-240 z" fill="#a8752a"/>
  <text x="430" y="213" text-anchor="middle" font-size="12.5" letter-spacing="2" fill="#ffffff" font-weight="700">PREVIEW</text>
  <text x="328" y="252" font-size="13" fill="#232b3e" font-weight="600">loading</text>
  <text x="328" y="270" font-size="11.5" fill="#6b6b6b">invoke: fetchPreview</text>
  <line x1="322" y1="284" x2="538" y2="284" stroke="#e5ddc9"/>
  <text x="328" y="312" font-size="13" fill="#232b3e" font-weight="600">loaded</text>
  <text x="328" y="330" font-size="11.5" fill="#6b6b6b">prorated line items</text>
  <line x1="322" y1="344" x2="538" y2="344" stroke="#e5ddc9"/>
  <text x="328" y="372" font-size="13" fill="#232b3e" font-weight="600">error</text>
  <text x="328" y="390" font-size="11.5" fill="#6b6b6b">retryable</text>
  <!-- retry self-loop -->
  <path d="M380,470 C380,508 480,508 472.6,485.4" fill="none" stroke="#5a4f3a" stroke-width="2"/><polygon points="480.0,476.0 475.9,489.3 468.0,483.1" fill="#5a4f3a"/>
  <rect x="395" y="506" width="70" height="22" rx="11" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="430" y="521" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a4f3a" font-weight="700">RETRY</text>

  <!-- PAYMENT (compound) -->
  <rect x="630" y="190" width="240" height="190" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
  <path d="M630,202 a12,12 0 0 1 12,-12 h216 a12,12 0 0 1 12,12 v24 h-240 z" fill="#6b5b95"/>
  <text x="750" y="213" text-anchor="middle" font-size="12.5" letter-spacing="2" fill="#ffffff" font-weight="700">PAYMENT</text>
  <text x="648" y="252" font-size="13" fill="#232b3e" font-weight="600">idle</text>
  <text x="648" y="270" font-size="11.5" fill="#6b6b6b">reuses card form</text>
  <line x1="642" y1="284" x2="858" y2="284" stroke="#e5ddc9"/>
  <text x="648" y="312" font-size="13" fill="#232b3e" font-weight="600">submitting</text>
  <text x="648" y="330" font-size="11.5" fill="#6b6b6b">invoke: confirmPayment</text>

  <!-- COMMITTING -->
  <rect x="950" y="300" width="190" height="120" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
  <path d="M950,312 a12,12 0 0 1 12,-12 h166 a12,12 0 0 1 12,12 v24 h-190 z" fill="#a34a3a"/>
  <text x="1045" y="323" text-anchor="middle" font-size="12.5" letter-spacing="2" fill="#ffffff" font-weight="700">COMMITTING</text>
  <text x="968" y="362" font-size="13" fill="#232b3e" font-weight="600">purchase</text>
  <text x="968" y="380" font-size="11.5" fill="#6b6b6b">invoke: purchase</text>
  <text x="968" y="404" font-size="13" fill="#232b3e" font-weight="600">one invoice</text>

  <!-- SUCCESS -->
  <rect x="950" y="450" width="190" height="120" rx="12" fill="#ffffff" stroke="#d8cfbc"/>
  <path d="M950,462 a12,12 0 0 1 12,-12 h166 a12,12 0 0 1 12,12 v24 h-190 z" fill="#2f4a3c"/>
  <text x="1045" y="473" text-anchor="middle" font-size="12.5" letter-spacing="2" fill="#ffffff" font-weight="700">SUCCESS</text>
  <text x="968" y="512" font-size="13" fill="#232b3e" font-weight="600">plan updated</text>
  <text x="968" y="536" font-size="13" fill="#232b3e" font-weight="600">billed prorated</text>

  <!-- event pills -->
  <rect x="244" y="321" width="64" height="22" rx="11" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="276" y="336" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a4f3a" font-weight="700">NEXT</text>
  <rect x="551" y="282" width="76" height="22" rx="11" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="589" y="297" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a4f3a" font-weight="700">CONFIRM</text>
  <rect x="878" y="308" width="58" height="22" rx="11" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="907" y="323" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a4f3a" font-weight="700">done</text>
  <rect x="1061" y="421" width="58" height="22" rx="11" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="1090" y="436" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a4f3a" font-weight="700">done</text>

  <text x="600" y="600" text-anchor="middle" font-size="14" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">impossible states are unrepresentable</text>
</svg>

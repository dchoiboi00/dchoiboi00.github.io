<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Avenir Next','Segoe UI',Verdana,sans-serif" role="img" aria-labelledby="title">
  <title id="title">Adjust Plan wizard statechart: adjust, preview, payment, committing, success, with a guarded CONFIRM that skips payment</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#c9bda3" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4f3a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7ba05b"/>
    </marker>
    <clipPath id="frame">
      <rect x="16" y="16" width="928" height="568"/>
    </clipPath>
  </defs>

  <rect width="960" height="600" fill="#faf6ee"/>

  <g clip-path="url(#frame)">
    <ellipse cx="100" cy="320" rx="110" ry="130" fill="#e3ecf5" opacity="0.45"/>
    <ellipse cx="460" cy="300" rx="260" ry="170" fill="#f5ead6" opacity="0.4"/>
    <ellipse cx="830" cy="400" rx="130" ry="160" fill="#e4efe4" opacity="0.45"/>
    <rect x="40" y="80" width="130" height="44" fill="url(#dots)"/>
    <rect x="40" y="500" width="130" height="40" fill="url(#dots)"/>
  </g>

  <rect x="16" y="16" width="928" height="568" fill="none" stroke="#d8cfbc" stroke-width="1"/>

  <text x="40" y="56" font-size="13" letter-spacing="3" fill="#8a7f68" font-weight="600">ADJUST PLAN WIZARD &#183; XSTATE</text>
  <text x="920" y="56" text-anchor="end" font-size="14" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">seven PRs &#183; one unchanged machine</text>

  <!-- Guarded shortcut: card on file or nothing due skips payment -->
  <path d="M316,176 C316,80 828,80 828,236" fill="none" stroke="#7ba05b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
  <rect x="417" y="98" width="310" height="26" rx="13" fill="#ffffff" stroke="#b9ac8e"/>
  <text x="572" y="115" text-anchor="middle" font-size="12.5" fill="#3e5c3e" font-weight="600">CONFIRM: card on file or $0 due, skip payment</text>

  <!-- ADJUST -->
  <rect x="28" y="230" width="140" height="142" rx="12" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M28,242 a12,12 0 0 1 12,-12 h116 a12,12 0 0 1 12,12 v20 h-140 z" fill="#2b3a55"/>
  <text x="98" y="251" text-anchor="middle" font-size="13" letter-spacing="2" fill="#ffffff" font-weight="700">ADJUST</text>
  <text x="44" y="290" font-size="15" fill="#232b3e" font-weight="600">plan editor</text>
  <text x="44" y="309" font-size="13" fill="#6b6b6b">plans, add-ons</text>
  <text x="44" y="337" font-size="15" fill="#232b3e" font-weight="600">cancel flow</text>
  <text x="44" y="356" font-size="13" fill="#6b6b6b">reason captured</text>

  <!-- PREVIEW -->
  <rect x="224" y="176" width="184" height="250" rx="12" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M224,188 a12,12 0 0 1 12,-12 h160 a12,12 0 0 1 12,12 v20 h-184 z" fill="#a8752a"/>
  <text x="316" y="197" text-anchor="middle" font-size="13" letter-spacing="2" fill="#ffffff" font-weight="700">PREVIEW</text>
  <text x="240" y="236" font-size="15" fill="#232b3e" font-weight="600">loading</text>
  <text x="240" y="255" font-size="13" fill="#6b6b6b">invoke: fetchPreview</text>
  <line x1="236" y1="272" x2="396" y2="272" stroke="#e5ddc9"/>
  <text x="240" y="300" font-size="15" fill="#232b3e" font-weight="600">loaded</text>
  <text x="240" y="319" font-size="13" fill="#6b6b6b">prorated line items</text>
  <line x1="236" y1="336" x2="396" y2="336" stroke="#e5ddc9"/>
  <text x="240" y="364" font-size="15" fill="#232b3e" font-weight="600">error</text>
  <text x="240" y="383" font-size="13" fill="#6b6b6b">retryable</text>

  <!-- PAYMENT -->
  <rect x="492" y="216" width="188" height="170" rx="12" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M492,228 a12,12 0 0 1 12,-12 h164 a12,12 0 0 1 12,12 v20 h-188 z" fill="#6b5b95"/>
  <text x="586" y="237" text-anchor="middle" font-size="13" letter-spacing="2" fill="#ffffff" font-weight="700">PAYMENT</text>
  <text x="508" y="276" font-size="15" fill="#232b3e" font-weight="600">idle</text>
  <text x="508" y="295" font-size="13" fill="#6b6b6b">reuses card form</text>
  <line x1="504" y1="312" x2="668" y2="312" stroke="#e5ddc9"/>
  <text x="508" y="340" font-size="15" fill="#232b3e" font-weight="600">submitting</text>
  <text x="508" y="359" font-size="13" fill="#6b6b6b">invoke: confirmPayment</text>

  <!-- COMMITTING -->
  <rect x="736" y="236" width="184" height="130" rx="12" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M736,248 a12,12 0 0 1 12,-12 h160 a12,12 0 0 1 12,12 v20 h-184 z" fill="#a34a3a"/>
  <text x="828" y="257" text-anchor="middle" font-size="13" letter-spacing="2" fill="#ffffff" font-weight="700">COMMITTING</text>
  <text x="752" y="294" font-size="15" fill="#232b3e" font-weight="600">purchase</text>
  <text x="752" y="313" font-size="13" fill="#6b6b6b">invoke: purchase</text>
  <text x="752" y="344" font-size="15" fill="#232b3e" font-weight="600">one invoice</text>

  <!-- SUCCESS -->
  <rect x="736" y="416" width="184" height="110" rx="12" fill="#ffffff" stroke="#d8cfbc" stroke-width="1.25"/>
  <path d="M736,428 a12,12 0 0 1 12,-12 h160 a12,12 0 0 1 12,12 v20 h-184 z" fill="#2f4a3c"/>
  <text x="828" y="437" text-anchor="middle" font-size="13" letter-spacing="2" fill="#ffffff" font-weight="700">SUCCESS</text>
  <text x="752" y="474" font-size="15" fill="#232b3e" font-weight="600">plan updated</text>
  <text x="752" y="500" font-size="15" fill="#232b3e" font-weight="600">billed prorated</text>

  <!-- Transitions -->
  <g stroke="#5a4f3a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="168" y1="301" x2="224" y2="301"/>
    <line x1="408" y1="301" x2="492" y2="301"/>
    <line x1="680" y1="301" x2="736" y2="301"/>
    <line x1="828" y1="366" x2="828" y2="416"/>
  </g>
  <path d="M292,426 C292,468 340,468 340,426" fill="none" stroke="#5a4f3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event pills -->
  <g fill="#ffffff" stroke="#b9ac8e">
    <rect x="173" y="271" width="46" height="20" rx="10"/>
    <rect x="414" y="271" width="72" height="20" rx="10"/>
    <rect x="686" y="271" width="44" height="20" rx="10"/>
    <rect x="840" y="381" width="44" height="20" rx="10"/>
    <rect x="290" y="448" width="52" height="20" rx="10"/>
  </g>
  <g font-size="11" letter-spacing="1" fill="#5a4f3a" font-weight="700" text-anchor="middle">
    <text x="196" y="285">NEXT</text>
    <text x="450" y="285">CONFIRM</text>
    <text x="708" y="285">done</text>
    <text x="862" y="395">done</text>
    <text x="316" y="462">RETRY</text>
  </g>

  <text x="480" y="566" text-anchor="middle" font-size="14" font-style="italic" fill="#8a7f68" font-family="Georgia,'Times New Roman',serif">impossible states are unrepresentable</text>
</svg>
